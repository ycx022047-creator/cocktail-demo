<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>基酒 · 9° 调酒手册</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- 装饰边框：左右竖排文字（随页面滚动） -->
  <div class="frame-side" id="frame-left" aria-hidden="true"></div>
  <div class="frame-side" id="frame-right" aria-hidden="true"></div>

  <!-- 顶部装饰文字条 -->
  <div class="frame-bar" aria-hidden="true"></div>

  <!-- 右上角小 logo -->
  <a class="corner-logo" href="index.html" title="返回首页">
    <img src="assets/logo-crop.jpg" alt="9° logo">
  </a>
  <a class="back-link" href="index.html" title="返回主页">
    <span class="back-arrow">←</span>
    <span>返回</span>
  </a>

  <main>
    <!-- 首屏：基酒大字 -->
    <section class="spirit-hero">
      <h1 id="spirit-name"></h1>
      <div class="en" id="spirit-en"></div>
      <p class="desc" id="spirit-desc"></p>
      <div class="scroll-hint">向下滑动 ↓</div>
    </section>

    <!-- 调酒列表 -->
    <section class="drinks" id="drinks">
      <!-- 由 script.js 渲染 -->
    </section>
  </main>

  <footer>
    <div class="brand">alcohol content · 9°</div>
    <p>适度饮酒 · 未成年人请勿饮酒</p>
  </footer>

  <!-- 底部装饰文字条 -->
  <div class="frame-bar" aria-hidden="true"></div>

  <script src="data.js"></script>
  <script src="script.js"></script>
</body>
</html>
